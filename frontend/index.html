<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Bus Booking | Bus travel, made easy</title>
  </head>
  <body>
    <div id="root">
      <!-- Initial Loading Screen - shown during app initialization -->
      <div id="app-loading" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%); z-index: 9999;">
        
        <!-- Logo -->
        <div style="margin-bottom: 2rem;">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 4px 8px rgba(0,0,0,0.08));">
            <defs>
              <linearGradient id="busGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
              </linearGradient>
            </defs>
            <rect x="4" y="8" width="16" height="10" rx="2" fill="url(#busGradient)"/>
            <rect x="6" y="10" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
            <rect x="10" y="10" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
            <rect x="14" y="10" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
            <circle cx="8" cy="19" r="1.5" fill="#2c3e50"/>
            <circle cx="16" cy="19" r="1.5" fill="#2c3e50"/>
            <path d="M4 8 L6 6 L18 6 L20 8" stroke="url(#busGradient)" stroke-width="1.5" fill="none"/>
          </svg>
        </div>
        
        <!-- Spinner -->
        <div style="position: relative; width: 64px; height: 64px; margin-bottom: 2rem;">
          <div style="position: absolute; inset: 0; border: 3px solid #f3f4f6; border-radius: 50%;"></div>
          <div style="position: absolute; inset: 0; border: 3px solid transparent; border-top-color: #e67e22; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        </div>
        
        <!-- Message -->
        <h2 style="margin: 0 0 0.5rem 0; font-family: 'Zoho Puvi', 'Inter', system-ui, -apple-system, sans-serif; font-size: 1.5rem; font-weight: 600; color: #1f2937; letter-spacing: -0.025em;">
          Loading BusBooking
        </h2>
        <p style="margin: 0 0 1.5rem 0; font-family: 'Zoho Puvi', 'Inter', system-ui, sans-serif; font-size: 0.875rem; color: #6b7280;">
          Preparing your travel experience
        </p>
        
        <!-- Animated Dots -->
        <div style="display: flex; gap: 0.5rem; align-items: center; justify-content: center;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #e67e22; animation: pulse 1.4s ease-in-out infinite;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #e67e22; animation: pulse 1.4s ease-in-out 0.2s infinite;"></div>
          <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #e67e22; animation: pulse 1.4s ease-in-out 0.4s infinite;"></div>
        </div>
      </div>
      
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.1); }
        }
        /* Hide loading screen once React mounts */
        #root:not(:empty) #app-loading {
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.3s ease-out;
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
