spring.application.name=busbooking

# spring.datasource.url=jdbc:mysql://localhost:3306/bus_booking
spring.datasource.url=jdbc:mysql://localhost:3306/bus_booking
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5VGhhdElzQXRMZWFzdDMyQnl0ZXM=
app.jwt.expiration-ms=3600000

# ── Mail (SMTP) ──────────────────────────────────────────────────────────────
# Set these in your .env or environment; defaults here are for Gmail SMTP.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── OTP settings ─────────────────────────────────────────────────────────────
# How long (minutes) an OTP stays valid before expiring
app.otp.expiry-minutes=10
# Maximum wrong attempts before an OTP is voided
app.otp.max-attempts=5
# Display name that appears in the From field of sent emails
app.otp.mail.from-name=Bus Booking
app.otp.expiration-ms=300000
app.otp.max-attempts=5