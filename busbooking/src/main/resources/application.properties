spring.application.name=busbooking

# spring.datasource.url=jdbc:mysql://localhost:3306/bus_booking
spring.datasource.url=jdbc:mysql://localhost:3306/bus_booking
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5VGhhdElzQXRMZWFzdDMyQnl0ZXM=
app.jwt.expiration-ms=3600000

# ── Mail (SMTP) ──────────────────────────────────────────────────────────────
# Set these in your .env or environment; defaults here are for Gmail SMTP.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── OTP settings ─────────────────────────────────────────────────────────────
# How long (minutes) an OTP stays valid before expiring
app.otp.expiry-minutes=10
# Maximum wrong attempts before an OTP is voided
app.otp.max-attempts=5
# Display name that appears in the From field of sent emails
app.otp.mail.from-name=Bus Booking
app.otp.expiration-ms=300000
app.otp.max-attempts=5

# ── Google OAuth ─────────────────────────────────────────────────────────────
app.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# ── Twitter (X) OAuth 2.0 PKCE ───────────────────────────────────────────────
app.twitter.client-id=${TWITTER_CLIENT_ID:}
app.twitter.client-secret=${TWITTER_CLIENT_SECRET:}
app.twitter.redirect-uri=${TWITTER_REDIRECT_URI:http://localhost:5173/auth/twitter/callback}
# Twitter OAuth 2.0 endpoints
app.twitter.auth-url=https://twitter.com/i/oauth2/authorize
app.twitter.token-url=https://api.twitter.com/2/oauth2/token
app.twitter.user-info-url=https://api.twitter.com/2/users/me

# ── Message Central VerifyNow API ────────────────────────────────────────────
# Message Central Credentials
app.messagecentral.customer-id=${MC_CUSTOMER_ID:}
app.messagecentral.auth-token=${MC_AUTH_TOKEN:}

# Message Central VerifyNow API
app.messagecentral.verifynow.base-url=${MC_VERIFYNOW_BASE_URL:https://cpaas.messagecentral.com/verification/v3}
app.messagecentral.verifynow.country-code=${MC_DEFAULT_COUNTRY_CODE:91}